# Rules for the dependencies, checked in the CI with `cargo deny check`.
# Every dependency must carry one of these licenses (or offer it as a choice) and come from
# crates.io. Known vulnerabilities make the run fail.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates count as errors only if Scrinium uses them directly. What egui,
# eframe and llama.cpp bring along cannot be swapped here;
# `cargo audit` lists it locally.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",   # webpki-roots (through ureq): root certificate data
    "ISC",
    "MIT",
    "MPL-2.0",               # option-ext (through dirs); used unmodified
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
