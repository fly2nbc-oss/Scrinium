name: Suggest an idea
description: An idea that makes sorting documents with Scrinium easier or faster.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Scrinium should stay simple: document in, check the suggestion, file it. Please describe the problem first – the best solution often looks different from the first idea.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what is in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: today
    attributes:
      label: How do you work around it today?
  - type: input
    id: version
    attributes:
      label: Scrinium version
      placeholder: "1.0.0"
