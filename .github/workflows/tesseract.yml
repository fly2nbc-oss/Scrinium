name: Tesseract

# Builds Tesseract for Windows as a single DLL (packaging/tesseract/build.ps1) and attaches the zip to a release
# of its own. The Windows build of the CI fetches it from there and embeds the DLL in scrinium.exe. Start it by hand
# only when Tesseract or the build recipe changes; then copy the hash into packaging/tesseract/SHA256SUMS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (Tesseract version and build number)
        required: true
        default: tesseract-5.5.3-1

permissions:
  contents: read

jobs:
  build:
    name: Tesseract DLL
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./packaging/tesseract/build.ps1 -Out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesseract
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      # Never "latest": Scrinium's update check reads the latest release and expects vX.Y.Z there.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create $env:TAG (Get-ChildItem dist -File).FullName `
            --title "Tesseract for Scrinium ($env:TAG)" `
            --notes "Tesseract as a single DLL for Windows x64 (vcpkg, without curl, libarchive, legacy engine and viewer), with the licenses of the built-in libraries. Embedded in scrinium.exe at build time." `
            --prerelease --latest=false
